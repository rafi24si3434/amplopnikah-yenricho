<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Dark/Gold Base -->
    <radialGradient id="sealBg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A2418" />
      <stop offset="50%" stop-color="#1A1712" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </radialGradient>

    <!-- Metallic 24K Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="25%" stop-color="#E2BD75" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="75%" stop-color="#8F6A26" />
      <stop offset="100%" stop-color="#E5C384" />
    </linearGradient>

    <!-- Batak Crimson Accent Gradient -->
    <linearGradient id="batakRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C02626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Specular Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C9A96E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Circular Medallion -->
  <circle cx="64" cy="64" r="61" fill="url(#sealBg)" stroke="url(#gold24k)" stroke-width="2.8" />
  
  <!-- Ulos Micro Stitch Ring -->
  <circle cx="64" cy="64" r="55.5" fill="none" stroke="url(#gold24k)" stroke-width="0.9" stroke-dasharray="2.5 2" opacity="0.8" />
  <circle cx="64" cy="64" r="53" fill="none" stroke="#8F1D1D" stroke-width="0.8" opacity="0.6" />

  <!-- Gorga Batak Floral & Laurel Wreath -->
  <g stroke="url(#gold24k)" stroke-width="1.5" fill="url(#gold24k)" filter="url(#goldGlow)">
    <!-- Royal Batak Crown at Top -->
    <path d="M64 16 L68 25 L75 23 L70 30 L73 37 L64 33 L55 37 L58 30 L53 23 L60 25 Z" />
    <circle cx="64" cy="14" r="1.8" fill="#FFF3D4" />

    <!-- Left Laurel & Gorga Spiral -->
    <path d="M64 26 C50 30 42 41 36 53 C30 64 29 77 34 89 C38 98 48 106 64 109" fill="none" stroke-width="1.8" />
    <path d="M52 35 Q46 31 43 38 Q48 42 52 35 Z" />
    <path d="M43 47 Q37 44 35 51 Q41 54 43 47 Z" />
    <path d="M37 61 Q31 59 30 66 Q36 69 37 61 Z" />
    <path d="M35 76 Q29 76 29 83 Q35 85 35 76 Z" />
    <path d="M39 90 Q34 93 37 99 Q42 97 39 90 Z" />

    <!-- Right Laurel & Gorga Spiral -->
    <path d="M64 26 C78 30 86 41 92 53 C98 64 99 77 94 89 C90 98 80 106 64 109" fill="none" stroke-width="1.8" />
    <path d="M76 35 Q82 31 85 38 Q80 42 76 35 Z" />
    <path d="M85 47 Q91 44 93 51 Q87 54 85 47 Z" />
    <path d="M91 61 Q97 59 98 66 Q92 69 91 61 Z" />
    <path d="M93 76 Q99 76 99 83 Q93 85 93 76 Z" />
    <path d="M89 90 Q94 93 91 99 Q86 97 89 90 Z" />

    <!-- Bottom Batak Geometric Accent -->
    <polygon points="64,103 67,107 64,111 61,107" fill="url(#gold24k)" />
    <circle cx="56" cy="107" r="1.5" fill="#8F1D1D" />
    <circle cx="72" cy="107" r="1.5" fill="#8F1D1D" />
  </g>

  <!-- Monogram Initials Y & V -->
  <!-- Y -->
  <text x="52" y="74" font-family="'Great Vibes', 'Brush Script MT', Georgia, cursive" font-size="36" font-weight="bold" fill="url(#gold24k)" text-anchor="middle" filter="url(#goldGlow)">Y</text>
  
  <!-- & (Ampersand with Batak Red accent) -->
  <text x="64" y="68" font-family="'Playfair Display', Georgia, serif" font-size="15" font-style="italic" font-weight="bold" fill="#FFF3D4" text-anchor="middle">&amp;</text>
  
  <!-- V -->
  <text x="76" y="80" font-family="'Great Vibes', 'Brush Script MT', Georgia, cursive" font-size="36" font-weight="bold" fill="url(#gold24k)" text-anchor="middle" filter="url(#goldGlow)">V</text>
</svg>
